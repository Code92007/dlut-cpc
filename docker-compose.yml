services:
  dlut-cpc:
    build: .
    container_name: dlut-cpc
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8021}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      SITE_DATA_PATH: ${SITE_DATA_PATH:-/app/data/site.json}
      DATABASE_PATH: ${DATABASE_PATH:-/app/runtime/dlut_cpc.sqlite3}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-/app/runtime/admin_password}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-1}
    volumes:
      - ./runtime:/app/runtime
